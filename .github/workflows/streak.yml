name: TikTok Streak Auto Send

permissions:
  contents: read

concurrency:
  group: tiktok-streak-send
  cancel-in-progress: false

on:
  schedule:
    # Chạy hàng ngày lúc 21:00 UTC (04:00 sáng giờ Việt Nam)
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      resolve_contacts:
        description: 'Chỉ chạy Resolver (không gửi tin nhắn)?'
        type: boolean
        required: false
        default: false
      debug_screenshots:
        description: 'Bật chụp ảnh màn hình debug?'
        type: boolean
        required: false
        default: false
      debug_html:
        description: 'Bật lưu mã HTML khi lỗi?'
        type: boolean
        required: false
        default: false

jobs:
  run-streak-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install selenium python-dotenv fastapi uvicorn pydantic
          fi

      - name: Install Chrome and ChromeDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Run recipient safety tests
        run: python -m unittest discover -s tests -v

      - name: Restore contacts cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            contacts.json
            message_history.json
          key: tiktok-streak-contacts-v2-${{ github.run_id }}
          restore-keys: |
            tiktok-streak-contacts-v2-

      - name: Run Streak Bot
        env:
          TIKTOK_USERNAME: ${{ secrets.TIKTOK_USERNAME }}
          TIKTOK_PASSWORD: ${{ secrets.TIKTOK_PASSWORD }}
          CAPTCHA_API_KEY: ${{ secrets.CAPTCHA_API_KEY }}
          # Tin nhắn — pool chung và theo từng ngày
          MESSAGES: ${{ secrets.MESSAGES }}
          MESSAGE_MON: ${{ secrets.MESSAGE_MON }}
          MESSAGE_TUE: ${{ secrets.MESSAGE_TUE }}
          MESSAGE_WED: ${{ secrets.MESSAGE_WED }}
          MESSAGE_THU: ${{ secrets.MESSAGE_THU }}
          MESSAGE_FRI: ${{ secrets.MESSAGE_FRI }}
          MESSAGE_SAT: ${{ secrets.MESSAGE_SAT }}
          MESSAGE_SUN: ${{ secrets.MESSAGE_SUN }}
          # Tương thích ngược với biến cũ
          MESSAGE: ${{ secrets.MESSAGE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          ARGS=""
          
          # Setup debug flags
          if [ "${{ github.event.inputs.debug_screenshots }}" = "true" ]; then
            ARGS="$ARGS --debug-screenshots"
          fi
          if [ "${{ github.event.inputs.debug_html }}" = "true" ]; then
            ARGS="$ARGS --debug-html"
          fi
          
          # Resolver is manual-only and never sends in the same run.
          if [ "${{ github.event.inputs.resolve_contacts }}" = "true" ]; then
            echo "Running contact resolver only; message sending is disabled."
            python streak_bot.py --resolve-contacts $ARGS
            exit 0
          fi
          
          echo "Starting strict recipient send flow..."
          python streak_bot.py --send $ARGS

      - name: Save contacts cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            contacts.json
            message_history.json
          key: tiktok-streak-contacts-v2-${{ github.run_id }}

      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-logs
          path: logs/
          if-no-files-found: ignore
