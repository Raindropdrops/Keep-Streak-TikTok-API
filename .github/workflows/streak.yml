name: TikTok Streak Auto Send

on:
  schedule:
    # Chạy hàng ngày lúc 21:00 UTC (04:00 sáng giờ Việt Nam)
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      resolve_contacts:
        description: 'Chạy Resolver cập nhật danh bạ trước khi gửi?'
        type: boolean
        required: false
        default: false
      debug_screenshots:
        description: 'Bật chụp ảnh màn hình debug?'
        type: boolean
        required: false
        default: false
      debug_html:
        description: 'Bật lưu mã HTML khi lỗi?'
        type: boolean
        required: false
        default: false

jobs:
  run-streak-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install selenium python-dotenv fastapi uvicorn pydantic
          fi

      - name: Install Chrome and ChromeDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Restore contacts cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: contacts.json
          key: tiktok-streak-contacts-v2-${{ github.run_id }}
          restore-keys: |
            tiktok-streak-contacts-v2-

      - name: Run Streak Bot
        env:
          TIKTOK_USERNAME: ${{ secrets.TIKTOK_USERNAME }}
          TIKTOK_PASSWORD: ${{ secrets.TIKTOK_PASSWORD }}
          CAPTCHA_API_KEY: ${{ secrets.CAPTCHA_API_KEY }}
          MESSAGE: ${{ secrets.MESSAGE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          ARGS=""
          
          # Tự động chạy resolver vào Thứ Hai hàng tuần hoặc khi kích hoạt thủ công
          RUN_RESOLVER="false"
          if [ "${{ github.event.inputs.resolve_contacts }}" = "true" ]; then
            RUN_RESOLVER="true"
          elif [ "${{ github.event_name }}" = "schedule" ] && [ "$(date +%u)" = "1" ]; then
            RUN_RESOLVER="true"
          fi
          
          # Setup debug flags
          if [ "${{ github.event.inputs.debug_screenshots }}" = "true" ]; then
            ARGS="$ARGS --debug-screenshots"
          fi
          if [ "${{ github.event.inputs.debug_html }}" = "true" ]; then
            ARGS="$ARGS --debug-html"
          fi
          
          # Chạy resolver nếu được yêu cầu
          if [ "$RUN_RESOLVER" = "true" ]; then
            echo "Kích hoạt Contact Resolver..."
            python streak_bot.py --resolve-contacts $ARGS
          fi
          
          # Luôn chạy gửi tin nhắn
          echo "Bắt đầu gửi tin nhắn..."
          python streak_bot.py --send $ARGS

      - name: Save contacts cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: contacts.json
          key: tiktok-streak-contacts-v2-${{ github.run_id }}-${{ github.run_number }}

      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-logs
          path: logs/
          if-no-files-found: ignore

